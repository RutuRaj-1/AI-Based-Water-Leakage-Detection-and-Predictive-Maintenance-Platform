# =============================================================================
# Pune Water Network AI — docker-compose.yml
# Local development environment.
# Provides only the PostgreSQL/PostGIS database service required for the
# backend. Additional services (Redis, Celery workers, etc.) will be added
# in future iterations as requirements are confirmed.
# =============================================================================

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 with PostGIS 3.4 extension
  # PostGIS is required for spatial pipeline network queries.
  # ---------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: pune_water_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pune_water_network}
      POSTGRES_USER: ${POSTGRES_USER:-pguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: mount init scripts (place *.sql files here to run on first start)
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pguser} -d ${POSTGRES_DB:-pune_water_network}"]
      interval: 10s
      timeout: 5s
      retries: 5

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
